<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24132f">
  <title>Soundroom — ミュージックプレーヤー</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Soundroom ホーム">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">soundroom</span>
      </a>
      <span class="topbar-note">YOUR MUSIC, YOUR SPACE</span>
    </header>

    <section id="home-screen" class="screen home-screen" aria-labelledby="home-title">
      <div class="hero-copy">
        <p class="eyebrow">YOUR LIBRARY</p>
        <h1 id="home-title">プレイリスト一覧</h1>
        <p class="subheading">今日の気分に合う音楽を選ぼう。</p>
      </div>

      <div class="section-heading">
        <h2>ライブラリ</h2>
        <span id="playlist-total" class="count-pill">0 PLAYLISTS</span>
      </div>
      <div id="playlist-list" class="playlist-grid" aria-live="polite">
        <div class="empty-state">
          <div class="empty-orbit" aria-hidden="true">♫</div>
          <strong>プレイリストを読み込んでいます…</strong>
          <p>setting.meta に登録された曲を読み込みます。</p>
        </div>
      </div>
      <p id="home-status" class="status-line" role="status"></p>
      <footer class="app-footer">MADE FOR THE MOMENT <span>•</span> SOUNDROOM</footer>
    </section>

    <section id="player-screen" class="screen player-screen hidden" aria-labelledby="player-heading">
      <button id="back-button" class="back-button" type="button"><span aria-hidden="true">←</span> プレイリスト選択に戻る</button>

      <div class="now-playing-label"><span class="playing-dot"></span> NOW PLAYING</div>
      <div class="album-art" aria-hidden="true">
        <div class="art-glow"></div>
        <div class="art-disc"><div class="disc-center"><span class="disc-note">♫</span></div></div>
        <div class="art-spark spark-one"></div><div class="art-spark spark-two"></div><div class="art-spark spark-three"></div>
      </div>

      <div class="track-information">
        <p id="current-playlist" class="playlist-kicker">PLAYLIST</p>
        <h1 id="player-heading">曲を選択してください</h1>
        <p id="current-artist" class="artist-name">アーティスト情報なし</p>
        <p id="current-album" class="album-name"></p>
      </div>

      <div class="timeline-block">
        <input id="seek-bar" class="range-input seek-input" type="range" min="0" max="1000" value="0" step="1" aria-label="再生位置" disabled>
        <div class="time-labels"><span id="current-time">0:00</span><span id="duration-time">0:00</span></div>
      </div>

      <div class="transport-controls" aria-label="再生コントロール">
        <button id="previous-button" class="icon-button side-control" type="button" aria-label="前の曲へ" title="前の曲へ"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 6l-9 6 9 6z"/></svg></button>
        <button id="play-button" class="play-button" type="button" aria-label="再生"><svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg><svg id="pause-icon" class="hidden" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM15 5h4v14h-4z"/></svg></button>
        <button id="stop-button" class="icon-button side-control" type="button" aria-label="停止" title="停止"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg></button>
        <button id="next-button" class="icon-button side-control" type="button" aria-label="次の曲へ" title="次の曲へ"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 6l9 6-9 6z"/></svg></button>
      </div>

      <div class="utility-row">
        <button id="repeat-button" class="utility-button" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3M3.5 10V8.5A3.5 3.5 0 0 1 7 5h13M7 22l-3-3 3-3M20.5 14v1.5A3.5 3.5 0 0 1 17 19H4"/></svg><span id="repeat-label">リピート OFF</span></button>
        <button id="lyrics-button" class="utility-button" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 5.5h16M4 10h16M4 14.5h10M4 19h7"/></svg><span>歌詞を表示</span></button>
      </div>

      <section id="lyrics-panel" class="lyrics-panel hidden" aria-label="歌詞">
        <div class="lyrics-heading"><h2>LYRICS</h2><span>歌詞</span></div>
        <p id="lyrics-content" class="lyrics-content">この曲の歌詞は登録されていません。</p>
      </section>

      <div class="volume-row">
        <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 9a5 5 0 0 1 0 6M18.5 6.5a8.5 8.5 0 0 1 0 11"/></svg>
        <input id="volume-bar" class="range-input volume-input" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="音量">
        <span id="volume-value" class="volume-value">80%</span>
      </div>

      <div class="queue-section">
        <div class="section-heading"><h2>このプレイリスト</h2><span id="track-total" class="count-pill">0 TRACKS</span></div>
        <div id="track-list" class="track-list"></div>
      </div>
      <p id="player-status" class="status-line" role="status"></p>
    </section>
  </main>
  <audio id="audio-element" preload="metadata"></audio>
</body>
</html>
