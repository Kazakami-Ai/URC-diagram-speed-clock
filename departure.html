<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>発車案内</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f4f6; color: #111827; }
    .app-header { display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 18px 24px; background: #111827; color: white; }
    h1 { margin: 0; font-size: 1.5rem; }
    .sub { margin: 5px 0 0; color: #d1d5db; font-size: .9rem; }
    .connection { padding: 7px 10px; border-radius: 999px; font-size: .85rem; white-space: nowrap; }
    .connection.connected { background: #166534; }
    .connection.disconnected { background: #991b1b; }
    main { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .clock-panel, .board-panel { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .clock-panel { padding: 18px; margin-bottom: 18px; }
    .clock-row { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .label { color: #6b7280; font-size: .85rem; }
    .clock { font-size: 2.3rem; font-variant-numeric: tabular-nums; font-weight: 700; }
    .tick { color: #6b7280; font-variant-numeric: tabular-nums; }
    .clock-settings { display: flex; gap: 18px; flex-wrap: wrap; }
    .fixed-value { color: #6b7280; }
    .fixed-value strong { display: block; color: #111827; margin-top: 3px; }
    .formula { margin-top: 12px; color: #6b7280; font-size: .85rem; }
    .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; color: #888; }
    .station-filter { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    select { min-width: 220px; padding: 8px 10px; border: 1px solid #555; border-radius: 4px; background: #333; color: #fff; }

    /* 表部分：前作.htmlの発車案内板デザインを、departure.htmlの8列構成に合わせて適用 */
    .board-panel {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      background: #050505;
      border: 4px solid #333;
      padding: 5px;
      box-sizing: border-box;
      overflow-x: auto;
    }
    .board-panel table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      table-layout: fixed;
      background: #050505;
      color: #fff;
    }
    .board-panel th, .board-panel td {
      border: 0;
      border-bottom: 1px solid #222;
      padding: 5px 8px;
      text-align: center;
      vertical-align: middle;
    }
    .board-panel th {
      background: #111;
      color: #888;
      font-size: 1.2rem;
      font-weight: 400;
      border-bottom: 2px solid #444;
    }
    .board-panel td {
      min-height: 120px;
      height: 120px;
      font-size: 2.5rem;
      font-weight: bold;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .board-panel tbody tr:last-child td { border-bottom: none; }
    .board-panel th:nth-child(1), .board-panel td:nth-child(1) { width: 7%; font-size: 1rem; color: #666; font-weight: 400; }
    .board-panel th:nth-child(2), .board-panel td:nth-child(2) { width: 13%; color: #ffb07b;}
    .board-panel th:nth-child(3), .board-panel td:nth-child(3) { width: 13%; }
    .board-panel th:nth-child(4), .board-panel td:nth-child(4) { width: 15%; font-variant-numeric: tabular-nums; }
    .board-panel th:nth-child(5), .board-panel td:nth-child(5) { width: 16%; white-space: normal; word-break: keep-all; overflow-wrap: break-word; }
    .board-panel th:nth-child(6), .board-panel td:nth-child(6) { width: 16%; text-overflow: ellipsis; }
    .board-panel th:nth-child(7), .board-panel td:nth-child(7) { width: 11%; white-space: normal; font-size: 1.6rem; }
    .board-panel th:nth-child(8), .board-panel td:nth-child(8) { width: 9%; white-space: normal; font-size: 1.6rem; }
    .board-panel tbody tr:nth-child(even), .board-panel tbody tr:nth-child(odd) { background: #050505; }

    .status-note { padding: 10px 0; color: #6b7280; font-size: .85rem; }
    #debugPanel { margin-top: 18px; background: #111827; color: #f9fafb; border-radius: 12px; padding: 14px; overflow-x: auto; }
    #debugPanel[hidden] { display: none; }
    .debug-title { font-weight: 700; margin-bottom: 8px; }
    .debug-summary { margin-bottom: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem; }
    #debugPanel table { min-width: 1200px; width: 100%; border-collapse: collapse; }
    #debugPanel th, #debugPanel td { border: 1px solid #374151; padding: 5px 7px; white-space: nowrap; font-size: .75rem; text-align: center; }
    #debugPanel th { background: #1f2937; }
    #debugPanel tbody tr:nth-child(even) { background: #1f2937; }
    @media (max-width: 700px) {
      .app-header { align-items: flex-start; flex-direction: column; }
      .clock-row { align-items: flex-start; flex-direction: column; }
      .station-filter { margin-left: 0; width: 100%; }
      select { width: 100%; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>発車案内</h1>
      <p class="sub">timetable.json と Firebase Realtime Database の currentState から表示</p>
    </div>
    <div id="firebaseStatus" class="connection disconnected">Firebase: 未接続</div>
  </header>

  <main>
    <section class="clock-panel">
      <div class="clock-row">
        <div>
          <div class="label">模型世界時計</div>
          <div id="modelClock" class="clock">00:00:00</div>
          <div id="tickValue" class="tick">0 tick</div>
        </div>
        <div class="clock-settings">
          <div class="fixed-value">Anchor<strong id="anchorDisplay">読み込み中…</strong></div>
          <div class="fixed-value">Speed<strong id="speedDisplay">読み込み中…</strong></div>
          <div class="fixed-value">Anchor_tick<strong>14400</strong></div>
        </div>
      </div>
      <div class="formula">tick = (現実時間 − Anchor) × Speed + Anchor_tick</div>
    </section>

    <div class="toolbar">
      <strong>発車案内</strong>
      <span id="loadMessage">データを読み込んでいます…</span>
      <div class="station-filter">
        <label for="stationAttribute">担当駅</label>
        <select id="stationAttribute"></select>
      </div>
    </div>

    <section class="board-panel" aria-label="発車案内表">
      <table>
        <thead>
          <tr>
            <th>index</th>
            <th>列車番号</th>
            <th>番線</th>
            <th>発車時刻</th>
            <th>種別</th>
            <th>行先</th>
            <th>遅れ</th>
            <th>待避</th>
          </tr>
        </thead>
        <tbody id="departureBody"></tbody>
      </table>
    </section>

    <section id="debugPanel" hidden aria-label="デバッグ表示">
      <div class="debug-title">DEBUG</div>
      <div id="debugBody"></div>
    </section>
  </main>

  <script type="module" src="departure.js"></script>
</body>
</html>
