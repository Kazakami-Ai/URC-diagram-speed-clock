<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模型時計設定</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>模型時計設定</h1>
      <p class="sub">Firebase Realtime Database の system を変更</p>
    </div>

    <div id="firebaseStatus" class="connection disconnected">
      Firebase: 未接続
    </div>
  </header>

  <main>
    <section class="settings-panel">
      <div class="settings-form">
        <label>
          Anchor
          <input id="anchorTime" type="time" step="1" value="06:00:00">
        </label>

        <label>
          Speed
          <select id="speed">
            <option value="1">1倍</option>
            <option value="2">2倍</option>
            <option value="3">3倍</option>
            <option value="4">4倍</option>
            <option value="5">5倍</option>
            <option value="6">6倍</option>
            <option value="10">10倍</option>
            <option value="12">12倍</option>
            <option value="15">15倍</option>
            <option value="20">20倍</option>
            <option value="30">30倍</option>
            <option value="60">60倍</option>
          </select>
        </label>

        <div class="fixed-value">
          Anchor_tick
          <strong>14400</strong>
        </div>

        <label>
          運行ステータス自動更新
          <select id="autoOperationStatus">
            <option value="true">有効</option>
            <option value="false">無効</option>
          </select>
        </label>

        <div class="settings-actions">
          <span id="saveMessage" class="settings-message">読み込み中…</span>
          <div class="settings-button-group">
            <button id="saveButton" class="settings-save" type="button">
              Firebaseに保存
            </button>
            <button id="resetButton" class="settings-save" type="button">
              ログ・状態をリセット
            </button>
          </div>
        </div>
      </div>

      <div class="settings-current">
        現在のFirebase設定<br>
        Anchor: <strong id="currentAnchor">読み込み中…</strong><br>
        Speed: <strong id="currentSpeed">読み込み中…</strong><br>
        運行ステータス自動更新: <strong id="currentAutoOperationStatus">読み込み中…</strong>
      </div>
    </section>
  </main>

  <script type="module" src="setting.js"></script>
</body>
</html>
